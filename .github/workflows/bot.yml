name: crypto-bot

on:
  schedule:
    # Disparador principal: cron-job.org llama cada 15 min (:05 :20 :35 :50) a workflow_dispatch por la API,
    # porque el reloj interno de GitHub deja de lanzar ejecuciones programadas (fallo conocido, oct-2026).
    # Este cron queda solo de respaldo. Repo público -> minutos de Actions gratis e ilimitados.
    # El ciclo diario lo hace la primera ejecución de cada día UTC; el resto gestiona la posición
    # (ventas parciales, stops, reentrada en máximo nuevo).
    - cron: "55 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = ciclo normal | dry-run = solo mirar, no firma | test-short = abre y cierra un corto pequeño"
        type: choice
        default: auto
        options: [auto, dry-run, test-short]
      test_coin:
        description: "Activo para test-short"
        default: ETH
      test_usd:
        description: "Tamaño en USD para test-short"
        default: "10"

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    # Dos colas de máquinas distintas: si GitHub satura una ("job was not acquired by Runner"), la otra sigue.
    # - cron-job.org (workflow_dispatch, cada 15 min)          -> ubuntu-slim (1 vCPU, cola propia; límite 15 min, el bot tarda <1 min)
    # - cron interno de respaldo (:55)                         -> ubuntu-24.04 fijo (no le afecta la migración de ubuntu-latest del 19-oct-2026)
    runs-on: ${{ github.event_name == 'schedule' && 'ubuntu-24.04' || 'ubuntu-slim' }}
    timeout-minutes: 12
    env:
      MODE: ${{ github.event.inputs.mode || 'auto' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # siempre el último estado de main (no el commit del momento en que se encoló la ejecución):
          # evita que una ejecución en cola repita una venta parcial con un estado viejo
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar bot
        env:
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
          WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
          ARB_RPC_URL: ${{ secrets.ARB_RPC_URL || 'https://arb1.arbitrum.io/rpc' }}
          SHORTS_ENABLED: ${{ vars.SHORTS_ENABLED || '1' }}
          SHORT_MAX_USD: ${{ vars.SHORT_MAX_USD || '1000000000' }}
        run: |
          case "$MODE" in
            dry-run)    python scripts/run_onchain.py --dry-run ;;
            test-short) python scripts/run_onchain.py --test-short "${{ github.event.inputs.test_coin }}" "${{ github.event.inputs.test_usd }}" ;;
            *)          python scripts/run_onchain.py --auto ;;
          esac

      - name: Guardar estado y logs
        if: always() && env.MODE != 'dry-run'
        run: |
          git config user.name "crypto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f logs/onchain_state.json logs/onchain_trades.csv logs/onchain.log logs/equity.csv || true
          git diff --cached --quiet || git commit -m "bot: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash || true
          git push || true
