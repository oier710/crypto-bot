{"name": "escaneo-mensual", "on": {"schedule": [{"cron": "17 14 1 * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"escaneo": {"runs-on": "ubuntu-24.04", "timeout-minutes": 30, "steps": [{"uses": "actions/checkout@v4", "with": {"ref": "main"}}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.11", "cache": "pip"}}, {"run": "pip install -r requirements.txt"}, {"name": "Escaneo de Dolomite y estudio de monedas", "run": "python scripts/research_2026_11i.py"}, {"name": "Guardar resultados", "run": "git config user.name crypto-bot && git config user.email bot@users.noreply.github.com && git add -f results/research_2026_11i.txt results/research_2026_11i.csv && (git diff --cached --quiet || git commit -m 'escaneo mensual de monedas') && git pull --rebase --autostash && git push"}]}}}
